substitutions:
  power_pin: GPIO7
  reboot_pin: GPIO4
  status_pin: GPIO5
  vm_button_pin: GPIO3
  api_key: !secret vector_spc_api
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password: !secret ap_password
  ota_password: !secret ota_password
  webhook_url: "http://webhook_url"

esphome:
  name: #your_device_name
  friendly_name: "POWER CONTROL" #your_friendly_name

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 115200
  logs:
    component.gpio: DEBUG
    multi_click: DEBUG

web_server:
  port: 80

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password}
  - platform: web_server

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "POWER-CONTROL-Fallback" #your_fallback_ssid
    password: ${ap_password}

http_request:
  useragent: esphome/vector-server-power-control
  timeout: 5s
  verify_ssl: false

switch:
  - platform: gpio
    pin: 
      number: ${power_pin}
      mode:
        output: true
        pulldown: true
    inverted: false
    id: power_button_switch
    restore_mode: ALWAYS_OFF
    internal: true
    
  - platform: gpio
    pin: 
      number: ${reboot_pin}
      mode:
        output: true
        pulldown: true
    inverted: false
    id: reboot_button_switch
    restore_mode: ALWAYS_OFF
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: ${status_pin}
      mode: INPUT
    name: "03 ✅ Server Status"
    device_class: power
    id: server_status
  
  - platform: gpio
    pin:
      number: ${vm_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "VM Control Button"
    id: vm_button
    internal: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_multi_click:
      - timing:
          - ON for at most 0.3s
          - OFF for at least 0.1s
          - ON for at most 0.3s
          - OFF for at least 0.1s
        then:
          - logger.log: "Double press - Stop VM"
          - http_request.get:
              url: "${webhook_url}/stop_win.sh"
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.3s
        then:
          - logger.log: "Single press - Start VM"
          - http_request.get:
              url: "${webhook_url}/start_win.sh"
      - timing:
          - ON for at least 4s
        then:
          - logger.log: "Long press - Force Stop VM"
          - http_request.get:
              url: "${webhook_url}/destroy_win.sh"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "00 🌐 IP Address"

sensor:
  - platform: uptime
    name: "01 ⏱ Uptime"
    entity_category: diagnostic

# Кнопки управления
button:
  - platform: template
    name: "03 🔌 Server Power On"
    icon: mdi:power
    on_press:
      - if:
          condition:
            binary_sensor.is_off: server_status
          then:
            - switch.turn_on: power_button_switch
            - delay: 500ms
            - switch.turn_off: power_button_switch
            - logger.log: "Server Power ON command sent"
          else:
            - logger.log: "Server is already ON, ignoring command"
  
  - platform: template
    name: "04 🔌 Server Shutdown"
    icon: mdi:power-off
    on_press:
      - if:
          condition:
            binary_sensor.is_on: server_status
          then:
            - switch.turn_on: power_button_switch
            - delay: 1s
            - switch.turn_off: power_button_switch
            - logger.log: "Server Power OFF command sent"
          else:
            - logger.log: "Server is already OFF, ignoring command"
  
  - platform: template
    name: "06 🔁 Server Reboot"
    icon: mdi:restart
    on_press:
      - switch.turn_on: reboot_button_switch
      - delay: 500ms
      - switch.turn_off: reboot_button_switch
  
  - platform: template
    name: "05 🚫 Server Force Shutdown"
    icon: mdi:alert-octagon
    on_press:
      - if:
          condition:
            binary_sensor.is_on: server_status
          then:
            - switch.turn_on: power_button_switch
            - delay: 5s
            - switch.turn_off: power_button_switch
            - logger.log: "Server Power OFF command sent"
          else:
            - logger.log: "Server is already OFF, ignoring command"
  
  - platform: template
    name: "07 ▶️ VM Start"
    icon: mdi:play-circle
    on_press:
      - http_request.get:
          url: "${webhook_url}/start_win.sh"
  
  - platform: template
    name: "08 ⏹️ VM Stop"
    icon: mdi:stop-circle
    on_press:
      - http_request.get:
          url: "${webhook_url}/stop_win.sh"
  
  - platform: template
    name: "09 📴 Force Stop VM"
    icon: mdi:close-octagon
    on_press:
      - http_request.get:
          url: "${webhook_url}/destroy_win.sh"
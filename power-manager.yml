                                  if (e != std::string::npos)
                                    vm = body.substr(p, e - p);
                                }

                                return "⏹️ " + vm;

                              message: !lambda |-

                                std::string vm = "VM";

                                size_t p = body.find("VM '");

                                if (p != std::string::npos) {

                                  p += 4;

                                  size_t e = body.find("'", p);

                                  if (e != std::string::npos)
                                    vm = body.substr(p, e - p);
                                }

                                return "Stopping " + vm;

                              priority: 5



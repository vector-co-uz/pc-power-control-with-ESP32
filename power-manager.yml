switch:

  - platform: gpio
    pin:
      number: ${power_pin}
      mode:
        output: true
        pulldown: true

    inverted: false
    id: power_button_switch
    restore_mode: ALWAYS_OFF
    internal: true
    icon: "mdi:toggle-switch"


  - platform: gpio
    pin:
      number: ${reboot_pin}
      mode:
        output: true
        pulldown: true

    inverted: false
    id: reboot_button_switch
    restore_mode: ALWAYS_OFF
    internal: true
    icon: "mdi:backup-restore"



binary_sensor:

  - platform: gpio

    pin:
      number: ${status_pin}
      mode: INPUT

    name: Server Status
    device_class: running
    id: server_status
    icon: "mdi:server-outline"

    web_server:
      sorting_group_id: server_group
      sorting_weight: 10


  - platform: gpio

    pin:
      number: ${vm_button_pin}
      mode: INPUT_PULLUP
      inverted: true

    name: "VM Control Button"
    id: vm_button
    internal: true

    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

    on_multi_click:

 
      - timing:
          - ON for at most 0.3s
          - OFF for at least 0.1s
          - ON for at most 0.3s
          - OFF for at least 0.1s

        then:

          - logger.log: "Double press - Stop VM"
          - script.execute: stop_vm1



      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.3s

        then:

          - logger.log: "Single press - Start VM"
          - script.execute: start_vm1


      - timing:
          - ON for at least 4s

        then:

          - logger.log: "Long press - Force Stop VM"
          - script.execute: destroy_vm1

    icon: "mdi:button-cursor"


text_sensor:

  - platform: wifi_info

    ip_address:
      name: IP Address
      icon: "mdi:wifi-check"


  - platform: template

    name: ${vm1_name} Status
    id: status_vm1
    icon: "mdi:dots-circle"

    web_server:
      sorting_group_id: vm1_group
      sorting_weight: 10


  - platform: template

    name: ${vm2_name} Status
    id: status_vm2
    icon: "mdi:dots-circle"

    web_server:
      sorting_group_id: vm2_group
      sorting_weight: 10


  - platform: template

    name: ${vm3_name} Status
    id: status_vm3
    icon: "mdi:dots-circle"

    web_server:
      sorting_group_id: vm3_group
      sorting_weight: 10


sensor:

  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    update_interval: 180s


button:


  - platform: template

    name: Server Power On
    icon: "mdi:power-cycle"

    on_press:

      - if:

          condition:
            binary_sensor.is_off: server_status

          then:

            - switch.turn_on: power_button_switch
            - delay: 500ms
            - switch.turn_off: power_button_switch

            - logger.log: "Power ON command sent"

            - script.execute:
                id: gotify_notify
                title: "🖥️ Unraid Server"
                message: "▶ Server turning ON"
                priority: 5

          else:

            - logger.log: "Server is already ON"

            - script.execute:
                id: gotify_notify
                title: "🖥️ Unraid Server"
                message: "▶ Server is already ON"
                priority: 5

    web_server:
      sorting_group_id: server_group
      sorting_weight: 20


  - platform: template

    name: Server Shutdown
    icon: "mdi:power-off"

    on_press:

      - if:

          condition:
            binary_sensor.is_on: server_status

          then:

            - switch.turn_on: power_button_switch
            - delay: 1s
            - switch.turn_off: power_button_switch

            - logger.log: "Server power OFF command sent"

            - script.execute:
                id: gotify_notify
                title: "🖥️ Unraid Server"
                message: "⏹ Server turning OFF"
                priority: 5
                
          else:

            - logger.log: "Server is already OFF"

            - script.execute:
                id: gotify_notify

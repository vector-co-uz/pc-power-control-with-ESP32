interval:

  - interval: 60s

    then:

      - http_request.get:
          url: "${webhook_url}/status-vm1.sh"
          capture_response: true

          on_response:

            then:

              - lambda: |-

                  std::string state = body;

                  state.erase(
                    0,
                    state.find_first_not_of(" \r\n\t")
                  );

                  state.erase(
                    state.find_last_not_of(" \r\n\t") + 1
                  );

                  id(status_vm1).publish_state(state);


  - interval: 60s

    then:

      - http_request.get:
          url: "${webhook_url}/status-vm2.sh"

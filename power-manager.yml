substitutions:
  power_pin: GPIO7
  reboot_pin: GPIO4
  status_pin: GPIO5
  vm_button_pin: GPIO3

  api_key: !secret vector_pm_api
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password: !secret ap_password
  ota_password: !secret ota_password

  webhook_url: !secret webhook_url
  gotify_url: !secret gotify_url
  gotify_token: !secret gotify_token
  
  vm1_name: Win11
  vm2_name: Ubuntu
  vm3_name: Fedora
  
esphome:
  name: !secret pm_name
  friendly_name: !secret pm_friendly


esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino


logger:
  level: INFO
  baud_rate: 115200
  logs:
    web_server: ERROR
    http_request: WARN
    http_request.idf: WARN


web_server:
  port: 80
  version: 3

  sorting_groups:
    - id: system_group
      name: "System"
      sorting_weight: 10

    - id: server_group
      name: "Server"
      sorting_weight: 20

    - id: vm1_group
      name: "${vm1_name} VM"
      sorting_weight: 30

    - id: vm2_group
      name: "${vm2_name} VM"
      sorting_weight: 40

    - id: vm3_group
      name: "${vm3_name} VM"
      sorting_weight: 50

    - id: switch_group
      name: "Switch VM"
      sorting_weight: 60


api:
  encryption:
    key: ${api_key}
  reboot_timeout: 0s


ota:
  - platform: esphome
    password: ${ota_password}

  - platform: web_server


wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

  ap:
    ssid: Vector-PM-Fallback
    password: ${ap_password}


http_request:
  useragent: esphome/vector-pm
  timeout: 5s
  verify_ssl: false


script:

  - id: gotify_notify
    parameters:
      title: string
      message: string
      priority: int

    then:
      - http_request.post:
          url: "${gotify_url}/message?token=${gotify_token}"

          request_headers:
            Content-Type: application/json

          body: !lambda |-

            std::string escaped;

            for (char c : message) {

              if (c == '"')
                escaped += "\\\"";

              else if (c == '\n')
                escaped += "\\n";

              else if (c == '\r')
                escaped += "\\r";

              else if (c == '\\')
                escaped += "\\\\";

              else
                escaped += c;
            }

            std::string escaped_title;

            for (char c : title) {

              if (c == '"')
                escaped_title += "\\\"";

              else if (c == '\\')
                escaped_title += "\\\\";

              else
                escaped_title += c;
            }

            return "{\"title\":\"" +
                   escaped_title +
                   "\",\"message\":\"" +
                   escaped +
                   "\",\"priority\":" +
                   std::to_string(priority) +
                   "}";


  - id: start_vm1
    then:
      - logger.log: "Start VM1"
        
      - http_request.get:
          url: "${webhook_url}/start-vm1.sh"
          capture_response: true

          on_response:
            then:

              - lambda: |-

                  ESP_LOGI("webhook",
                           "Response: %s",
                           body.c_str());

              - if:
                  condition:
                    lambda: |-
                      return body.find("error:") != std::string::npos;

                  then:

                    - script.execute:
                        id: gotify_notify

                        title: !lambda |-

                          std::string vm = "VM";

                          size_t p = body.find("VM_NAME=");

                          if (p != std::string::npos) {

                            p += 8;

                            size_t e = body.find('\n', p);

                            if (e == std::string::npos)
                              e = body.length();

                            vm = body.substr(p, e - p);
                          }

                          else {

                            p = body.find("VM '");

                            if (p != std::string::npos) {

                              p += 4;

                              size_t e = body.find("'", p);

                              if (e != std::string::npos)
                                vm = body.substr(p, e - p);
                            }
                          }

                          return "❌ " + vm;

                        message: !lambda |-
                          return body;

                        priority: 8

                  else:

                    - script.execute:
                        id: gotify_notify

                        title: !lambda |-

                          std::string vm = "VM";

                          size_t p = body.find("VM_NAME=");

                          if (p != std::string::npos) {

                            p += 8;

                            size_t e = body.find('\n', p);

                            if (e == std::string::npos)
                              e = body.length();

                            vm = body.substr(p, e - p);
                          }

                          else {

                            p = body.find("VM '");

                            if (p != std::string::npos) {

                              p += 4;

                              size_t e = body.find("'", p);

                              if (e != std::string::npos)
                                vm = body.substr(p, e - p);
                            }
                          }

                          return "▶️ " + vm;

                        message: !lambda |-

                          if (body.find("already running") != std::string::npos)
                            return std::string("VM is already running");

                          return std::string("VM is starting");

                        priority: 5


  - id: stop_vm1
    then:
      - logger.log: "Stop VM1"

      - http_request.get:
          url: "${webhook_url}/stop-vm1.sh"
          capture_response: true

          on_response:

                            size_t e = body.find("'", p);

                            if (e != std::string::npos)
                              vm = body.substr(p, e - p);
                          }

                          return "❌ " + vm;

                        message: !lambda |-
                          return body;

                        priority: 8

                  else:

                    - if:
                        condition:
                          lambda: |-
                            return body.find("already stopped") != std::string::npos;

                        then:

                          - script.execute:
